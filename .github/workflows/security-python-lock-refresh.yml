name: Security Python runtime lock refresh
on:
  push:
    branches: [security/python-runtime-highs-20260926]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/python-runtime-highs-20260926
          fetch-depth: 0
      - run: python -m pip install --disable-pip-version-check uv==0.10.0
      - run: uv lock --upgrade-package cryptography --upgrade-package starlette --upgrade-package python-multipart --upgrade-package urllib3
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --cached --quiet && exit 1
          git commit -m "security: refresh Python runtime locks"
          git push origin HEAD:security/python-runtime-highs-20260926
