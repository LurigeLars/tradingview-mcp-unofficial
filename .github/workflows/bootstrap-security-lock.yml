name: Bootstrap security lock

on:
  push:
    branches:
      - security/dependency-advisories-20260930

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/dependency-advisories-20260930
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.17"
      - name: Resolve and commit lockfile
        run: |
          uv lock
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "security: refresh patched uv lock"
          git push origin HEAD:security/dependency-advisories-20260930
